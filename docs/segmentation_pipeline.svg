<svg width="700" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>U-Net image segmentation pipeline</title>
<desc>Diagram showing how a panoramic X-ray flows through a U-Net encoder-decoder with skip connections to produce a segmented output with tooth contours and metrics.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }

  @media (prefers-color-scheme: light) {
    .bg-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .bg-gray .th { fill: #2C2C2A; }
    .bg-gray .ts { fill: #5F5E5A; }
    .bg-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .bg-teal .th { fill: #085041; }
    .bg-teal .ts { fill: #0F6E56; }
    .bg-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .bg-purple .th { fill: #26215C; }
    .bg-purple .ts { fill: #534AB7; }
    .bg-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .bg-coral .th { fill: #4A1B0C; }
    .bg-coral .ts { fill: #993C1D; }
    .bg-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .bg-amber .th { fill: #412402; }
    .bg-amber .ts { fill: #854F0B; }
    .arr-line { stroke: #5F5E5A; }
    .skip-path { stroke: #0F6E56; }
    .skip-text { fill: #0F6E56; }
    .output-text { fill: #444441; }
  }

  @media (prefers-color-scheme: dark) {
    .bg-gray rect { fill: #444441; stroke: #B4B2A9; }
    .bg-gray .th { fill: #F1EFE8; }
    .bg-gray .ts { fill: #D3D1C7; }
    .bg-teal rect { fill: #085041; stroke: #5DCAA5; }
    .bg-teal .th { fill: #E1F5EE; }
    .bg-teal .ts { fill: #9FE1CB; }
    .bg-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .bg-purple .th { fill: #EEEDFE; }
    .bg-purple .ts { fill: #CECBF6; }
    .bg-coral rect { fill: #712B13; stroke: #F0997B; }
    .bg-coral .th { fill: #FAECE7; }
    .bg-coral .ts { fill: #F5C4B3; }
    .bg-amber rect { fill: #633806; stroke: #FAC775; }
    .bg-amber .th { fill: #FAEEDA; }
    .bg-amber .ts { fill: #FAC775; }
    .arr-line { stroke: #B4B2A9; }
    .skip-path { stroke: #5DCAA5; }
    .skip-text { fill: #5DCAA5; }
    .output-text { fill: #D3D1C7; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Input image box -->
<g class="bg-gray">
  <rect x="40" y="20" width="600" height="56" rx="12" stroke-width="0.5"/>
  <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Panoramic X-ray input</text>
  <text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">Grayscale, resized to 512 x 512, normalized [0, 1]</text>
</g>

<!-- Arrow down to encoder/decoder row -->
<line x1="340" y1="76" x2="340" y2="140" class="arr-line" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Skip connections: dashed arc above encoder and decoder -->
<path d="M185 140 Q185 100, 340 100 Q495 100, 495 140" fill="none" class="skip-path" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text class="ts skip-text" x="340" y="92" text-anchor="middle" dominant-baseline="central">Skip connections</text>

<!-- Encoder -->
<g class="bg-teal">
  <rect x="40" y="140" width="280" height="56" rx="12" stroke-width="0.5"/>
  <text class="th" x="180" y="160" text-anchor="middle" dominant-baseline="central">U-Net encoder</text>
  <text class="ts" x="180" y="178" text-anchor="middle" dominant-baseline="central">Feature extraction layers</text>
</g>

<!-- Decoder -->
<g class="bg-purple">
  <rect x="360" y="140" width="280" height="56" rx="12" stroke-width="0.5"/>
  <text class="th" x="500" y="160" text-anchor="middle" dominant-baseline="central">U-Net decoder</text>
  <text class="ts" x="500" y="178" text-anchor="middle" dominant-baseline="central">Upsampling + reconstruction</text>
</g>

<!-- Arrow from encoder down and across to decoder -->
<line x1="180" y1="196" x2="180" y2="226" class="arr-line" stroke-width="1.5"/>
<line x1="180" y1="226" x2="493" y2="226" class="arr-line" stroke-width="1.5"/>
<line x1="500" y1="216" x2="500" y2="226" class="arr-line" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Sigmoid output -->
<g class="bg-coral">
  <rect x="360" y="232" width="280" height="44" rx="12" stroke-width="0.5"/>
  <text class="th" x="500" y="254" text-anchor="middle" dominant-baseline="central">Sigmoid probability map</text>
</g>

<!-- Arrow down -->
<line x1="500" y1="276" x2="500" y2="296" class="arr-line" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Post-processing -->
<g class="bg-amber">
  <rect x="200" y="296" width="440" height="56" rx="12" stroke-width="0.5"/>
  <text class="th" x="420" y="316" text-anchor="middle" dominant-baseline="central">Post-processing</text>
  <text class="ts" x="420" y="334" text-anchor="middle" dominant-baseline="central">Otsu threshold + morphological open/close</text>
</g>

<!-- Arrow down to output -->
<line x1="420" y1="352" x2="420" y2="362" class="arr-line" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Output label -->
<text class="ts output-text" x="420" y="376" text-anchor="middle" dominant-baseline="central">Segmented contours + tooth count + per-tooth metrics</text>

</svg>